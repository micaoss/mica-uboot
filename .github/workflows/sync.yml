name: sync

# Manual only: fast-forward the mirrors and merge them into the boards (README.md, "Updating U-Boot"). U-Boot is
# pinned by commit in mica-build and not synced automatically. A row that needs a human (an upstream that is not a
# fast-forward, a merge conflict) pushes nothing, opens an issue and fails the run; the other rows still go through.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be pushed, push nothing
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          git config user.name "mica-uboot sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          SYNC_REPORT="$RUNNER_TEMP/sync-report.txt" bash scripts/sync.sh $DRY_RUN
      - name: Open an issue for the rows that need a human
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "sync ${{ steps.sync.outputs.date }}: rows need a human"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/sync-report.txt"
          [ -s "$report" ] || exit 0
          body="$(printf 'Run: %s\n\n```\n%s\n```\n\nSee README.md, "Updating U-Boot".\n' "$RUN_URL" "$(cat "$report")")"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
